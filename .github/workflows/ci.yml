name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      numerical_required: ${{ steps.classify.outputs.numerical_required }}
      reason: ${{ steps.classify.outputs.reason }}
      changed_file_count: ${{ steps.classify.outputs.changed_file_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Classify changed paths
        id: classify
        run: node scripts/ciChangeClassifier.mjs
      - name: Report CI classification
        run: |
          echo "CI classification:"
          echo "numerical_required=${{ steps.classify.outputs.numerical_required }}"
          echo "reason=${{ steps.classify.outputs.reason }}"
          echo "changed_file_count=${{ steps.classify.outputs.changed_file_count }}"

  core:
    name: core
    needs: classify
    if: ${{ always() && needs.classify.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Agent tests
        run: npm run test:agent
      - name: Synthetic CRS Harness Gate
        run: npm run harness:crs:synthetic
      - name: Industry Parity Reference Gate
        run: npm run parity:industry-reference
      - name: Build
        run: npm run build
      - name: CLI Smoke JSON
        run: node node_modules/tsx/dist/cli.mjs src/cli.ts --input tests/fixtures/cli_smoke.dat --output json --out cli-smoke.json --autoadjust off
      - name: CLI Smoke Listing
        run: node node_modules/tsx/dist/cli.mjs src/cli.ts --input tests/fixtures/cli_smoke.dat --profile industry-parity --output listing --out cli-smoke.txt --autoadjust on --autoadjust-threshold 4 --autoadjust-cycles 2 --autoadjust-max-removals 1
      - name: Legacy Corpus Gate
        run: npm run corpus:legacy:ci
      - name: Upload Legacy Corpus Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-corpus-summary
          path: artifacts/legacy-corpus/
          if-no-files-found: warn

  numerical:
    name: numerical
    needs: classify
    if: ${{ always() && needs.classify.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Skip numerical certification for safe-only PR
        if: ${{ needs.classify.outputs.numerical_required != 'true' }}
        run: echo "Numerical certification not required for this PR. All changed paths are classified safe-only."
      - name: Install
        if: ${{ needs.classify.outputs.numerical_required == 'true' }}
        run: npm ci
      - name: Setup Emscripten
        if: ${{ needs.classify.outputs.numerical_required == 'true' }}
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.5
          actions-cache-folder: emsdk-cache
      - name: Build WASM test artifact
        if: ${{ needs.classify.outputs.numerical_required == 'true' }}
        run: npm run wasm:build
      - name: Configure native C++ tests
        if: ${{ needs.classify.outputs.numerical_required == 'true' }}
        run: npm run cpp:configure
      - name: Build native C++ tests
        if: ${{ needs.classify.outputs.numerical_required == 'true' }}
        run: npm run cpp:build
      - name: CTest
        if: ${{ needs.classify.outputs.numerical_required == 'true' }}
        run: npm run cpp:test
      - name: Real-WASM tests
        if: ${{ needs.classify.outputs.numerical_required == 'true' }}
        run: npm run test:wasm
      # Release gate is the fast automatic verdict over committed reports.
      # The slow evidence campaigns (test:evidence / tests/evidence/) are
      # omitted by design — like test:full, they never run in CI. Run them
      # manually via the Evidence workflow (.github/workflows/evidence.yml).
      - name: Release certification tests
        if: ${{ needs.classify.outputs.numerical_required == 'true' }}
        run: npm run test:release
