name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.5
          actions-cache-folder: emsdk-cache
      - name: Build WASM test artifact
        run: npm run wasm:build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:run
      - name: Synthetic CRS Harness Gate
        run: npm run harness:crs:synthetic
      - name: Industry Parity Reference Gate
        run: npm run parity:industry-reference
      - name: Build
        run: npm run build
      - name: CLI Smoke JSON
        run: node node_modules/tsx/dist/cli.mjs src/cli.ts --input tests/fixtures/cli_smoke.dat --output json --out cli-smoke.json --autoadjust off
      - name: CLI Smoke Listing
        run: node node_modules/tsx/dist/cli.mjs src/cli.ts --input tests/fixtures/cli_smoke.dat --profile industry-parity --output listing --out cli-smoke.txt --autoadjust on --autoadjust-threshold 4 --autoadjust-cycles 2 --autoadjust-max-removals 1
      - name: Legacy Corpus Gate
        run: npm run corpus:legacy:ci
      - name: Upload Legacy Corpus Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-corpus-summary
          path: artifacts/legacy-corpus/
          if-no-files-found: warn
  phase8b1-clean-runner-gate:
    # Focused real-route gate (CI-sized): the real WASM artifact must exist
    # (absence fails, never skips), the route stays default-OFF, and the
    # anchor/camp/eligible-adjustment shapes hold through the exact
    # production worker dispatch. The 10-minute 120-session release stress
    # already runs in the main job's full-suite Test step (npm run test:run);
    # the browser proof stays local-only (see reports/phase8b1/).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.5
          actions-cache-folder: emsdk-cache
      - name: Build WASM test artifact
        run: npm run wasm:build
      - name: Phase 8B.1 clean-runner gate
        run: node scripts/runVitest.mjs run tests/phase8b1_clean_runner_gate.test.ts
