# Study Desktop versioned release (manual / tag-triggered only).
#
# Builds versioned Linux + Windows artifacts and gathers them with a
# SHA256SUMS final artifact. Never auto-publishes a GitHub Release and
# never runs on plain pushes — the existing study-desktop.yml stays the
# per-push CI gate.
#
# NOTE: this file lives under .github/workflows/, which the root CI
# classifier treats as numerical-required on every workflow-file change;
# study-desktop/** source changes themselves remain safe-only.

name: study-desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'study-v*'

permissions:
  contents: read

jobs:
  build-linux:
    name: release build (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: study-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: study-desktop/package-lock.json
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Frontend install
        run: npm ci
      - name: Version consistency check
        run: npm run check:version
      - name: Tauri production build
        run: npm run tauri:build
        env:
          STUDY_COMMIT: ${{ github.sha }}
      - name: Upload Linux bundles
        uses: actions/upload-artifact@v7
        with:
          name: study-desktop-release-linux-${{ github.ref_name }}
          path: |
            study-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            study-desktop/src-tauri/target/release/bundle/deb/*.deb
            study-desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  build-windows:
    name: release build (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: study-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: study-desktop/package-lock.json
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Frontend install
        run: npm ci
      - name: Version consistency check
        run: npm run check:version
      - name: Tauri production build
        # WiX MSI rejects SemVer prerelease labels; override only installer
        # metadata, while frontend/package identity remains beta. Rename below.
        run: npx tauri build --config '{"version":"0.1.0"}'
        env:
          STUDY_COMMIT: ${{ github.sha }}
      - name: Rename Windows bundles
        shell: pwsh
        run: |
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Name -match '0\.1\.0' } |
            ForEach-Object {
              Rename-Item $_.FullName ($_.Name -replace '0\.1\.0', '0.1.0-beta.1')
            }
      - name: Upload Windows bundles
        uses: actions/upload-artifact@v7
        with:
          name: study-desktop-release-windows-${{ github.ref_name }}
          path: |
            study-desktop/src-tauri/target/release/bundle/msi/*.msi
            study-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  checksums:
    name: gather artifacts + SHA256SUMS
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - name: Download all release bundles
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          pattern: study-desktop-release-*
          merge-multiple: false
      - name: Create SHA256SUMS
        run: |
          set -euo pipefail
          cd release-artifacts
          mapfile -d '' distributables < <(
            find . -type f \( \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.msi' -o \
              -name '*-setup.exe' \
            \) -print0 | sort -z
          )
          if [[ ${#distributables[@]} -ne 5 ]]; then
            echo "Expected exactly 5 distributables, found ${#distributables[@]}:"
            printf '%s\n' "${distributables[@]}"
            exit 1
          fi
          # This workflow currently targets the fixed 0.1.0-beta.1 beta release.
          for file in "${distributables[@]}"; do
            name=$(basename "$file")
            if [[ "$name" != *'0.1.0-beta.1'* ]]; then
              echo "Distributable filename has unexpected version: $name"
              exit 1
            fi
          done
          : > ../SHA256SUMS
          for file in "${distributables[@]}"; do
            sha256sum "$file" | awk -v name="$(basename "$file")" '{print $1 "  " name}' >> ../SHA256SUMS
          done
          cat ../SHA256SUMS
      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v7
        with:
          name: study-desktop-release-sha256sums-${{ github.ref_name }}
          path: SHA256SUMS
          if-no-files-found: error
